{% extends "management/base.html" %}

{% block content %}
<div class="container">
  <h2 class="mt-3">{% if edit %}Editar Tarefa{% else %}Nova Tarefa{% endif %}</h2>
  {% if membro %}
      <p>Colaborador: <strong>{{ membro.nome_completo }}</strong></p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">{% if edit %}Salvar Alterações{% else %}Salvar{% endif %}</button>
    <a href="{% if membro %}{% url 'lista_tarefas_member' membro.id %}{% else %}{% url 'lista_tarefas' %}{% endif %}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
