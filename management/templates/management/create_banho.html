{% extends "management/base.html" %}

{% block content %}
<div class="container">
  <h2 class="mt-3">{% if edit %}Editar{% else %}Novo{% endif %} Banho</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">{% if edit %}Salvar{% else %}Criar{% endif %}</button>
    <a href="{% url 'lista_banhos' %}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
