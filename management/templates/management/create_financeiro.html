{% extends "management/base.html" %}

{% block content %}
<div class="container">
  <h2 class="mt-3">Nova Transação Financeira</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Criar</button>
    <a href="{% url 'financeiro' %}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
